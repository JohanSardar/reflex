name: Reflex
options:
  bundleIdPrefix: si.eilmer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  ReflexInput:
    path: Packages/ReflexInput
  ReflexLink:
    path: Packages/ReflexLink
targets:
  Reflex:
    type: application
    platform: iOS
    sources:
      - path: Reflex
    dependencies:
      - package: ReflexInput
      - package: ReflexLink
    info:
      path: Reflex/Info.plist
      properties:
        NSBonjourServices: [_reflex-link._tcp, _reflex-p2p._tcp]
        NSLocalNetworkUsageDescription: Reflex finds and syncs with the Reflex Link on your computer over the local network, or directly over peer-to-peer Wi-Fi.
        NSCameraUsageDescription: Reflex uses the camera to take photos you add to a board.
        NSMicrophoneUsageDescription: Hold the mic to talk to your agents about this board. Speech is turned into text on this iPad.
        NSSpeechRecognitionUsageDescription: Reflex turns what you say about a board into text on this iPad, so it goes with your Send.
        CFBundleURLTypes:
          - CFBundleURLName: si.eilmer.reflex.pair
            CFBundleURLSchemes: [reflex]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.eilmer.reflex
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Reflex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
