[package]
name = "reflex-kernel-wasm"
description = "TypeScript binding (wasm-bindgen) for the Reflex kernel, for Node, browsers and Cloudflare Workers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reflex-kernel = { path = "../core" }
# Automerge picks a random actor before the kernel overrides it; on wasm32 that
# needs the JS crypto source. The kernel itself never uses randomness.
automerge = { workspace = true, features = ["wasm"] }
wasm-bindgen = "0.2.104"
