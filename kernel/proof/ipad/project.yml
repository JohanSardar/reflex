# Kernel proof app: the Swift replica of one Space, in the iPad Simulator.
# Generate the project with `xcodegen` after running kernel/swift/build.sh.
name: KernelProof
options:
  bundleIdPrefix: dev.reflex
  deploymentTarget:
    iOS: "17.0"
packages:
  ReflexKernel:
    path: ../../swift
targets:
  KernelProof:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ReflexKernel
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kernel Proof
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
