# Keeps the `npx` branch in step with main's dist/reflex.mjs. That branch holds only package.json and the built CLI,
# so `npx -y github:jujdontbudge/reflex#npx mcp` downloads about 1 MB instead of the whole repository, and starts
# well inside a harness's wait for a new MCP server. Runs on GitHub's runners.
name: npx branch
on:
  push:
    branches: [main]
    paths: [dist/reflex.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: npx
          path: npx
      - name: Copy the build and push it if it changed
        run: |
          mkdir -p npx/dist
          cp main/dist/reflex.mjs npx/dist/reflex.mjs
          cd npx
          git add dist/reflex.mjs
          if git diff --cached --quiet; then echo "npx branch already current"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "npx build of ${GITHUB_SHA::7}"
          git push origin npx
