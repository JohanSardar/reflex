name: Feature request
description: Suggest an improvement to drawing, speaking or sending to an agent.
title: "Idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the real workflow and the part that gets in your way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: How would it work, and what alternatives have you tried?
    validations:
      required: true
