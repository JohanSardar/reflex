<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="reflex-background" content="transparent">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Transparent, so the sketch underneath shows through. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px -apple-system, system-ui, "Segoe UI", sans-serif; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .lbl { font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .num { font-size: 11px; font-weight: 700; fill: #fff; }
  .pill { font-size: 11px; fill: #6e6e73; }
</style>
</head>
<body>
<svg id="o"></svg>
<script>
(() => {
  const SVG = "http://www.w3.org/2000/svg";
  const COLORS = { red: "#e5484d", orange: "#f76b15", yellow: "#d6a500", green: "#30a46c", teal: "#12a594", blue: "#0090ff", violet: "#6e56cf", pink: "#d6409f" };
  const p = reflex.element.props();
  const visible = p.visible !== false;
  const items = (Array.isArray(p.items) ? p.items : []).map((it, i) => ({ ...it, n: i + 1 }));
  const svg = document.getElementById("o");
  /** Each correction's drawn box, for Anchors. */
  let boxes = [];
  const el = (tag, attrs, text, parent = svg) => {
    const n = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
    if (text !== undefined) n.textContent = text; // text, never markup
    parent.append(n);
    return n;
  };
  const colorOf = (c) => COLORS[c] ?? (typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c) ? c : COLORS.red);
  const pts = (it) => (Array.isArray(it.points) ? it.points.filter((q) => Array.isArray(q) && q.length >= 2).map((q) => [+q[0], +q[1]]) : []);

  function draw() {
    svg.replaceChildren();
    boxes = [];
    svg.setAttribute("viewBox", `0 0 ${innerWidth} ${innerHeight}`);
    if (!visible) {
      el("text", { x: innerWidth - 8, y: innerHeight - 8, class: "pill", "text-anchor": "end" }, "corrections hidden");
      return;
    }
    const defs = el("defs", {});
    for (const [name, col] of Object.entries(COLORS)) {
      const m = el("marker", { id: `a-${name}`, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, undefined, defs);
      el("path", { d: "M0,0 L10,5 L0,10 z", fill: col }, undefined, m);
    }
    for (const it of items) {
      const col = colorOf(it.color);
      const colName = Object.keys(COLORS).find((k) => COLORS[k] === col) ?? "red";
      const g = el("g", { opacity: 0.9 });
      const P = pts(it);
      let box = null;
      const dash = it.style === "dashed" ? "8 6" : "";
      if ((it.kind === "line" || it.kind === "arrow" || it.kind === "path") && P.length >= 2) {
        const d = it.kind === "path" && P.length > 2
          ? `M${P[0][0]},${P[0][1]} ` + P.slice(1).map((q, i) => { const a = P[i]; return `Q${a[0]},${a[1]} ${(a[0] + q[0]) / 2},${(a[1] + q[1]) / 2}`; }).join(" ") + ` L${P[P.length - 1][0]},${P[P.length - 1][1]}`
          : `M${P.map((q) => q.join(",")).join(" L")}`;
        el("path", { d, fill: "none", stroke: col, "stroke-width": it.width ?? 3, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": dash, ...(it.kind === "arrow" ? { "marker-end": `url(#a-${colName})` } : {}) }, undefined, g);
        const xs = P.map((q) => q[0]), ys = P.map((q) => q[1]);
        box = [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
      } else if ((it.kind === "circle" || it.kind === "rect") && Array.isArray(it.box) && it.box.length === 4) {
        const [x, y, w, h] = it.box.map(Number);
        if (it.kind === "circle") el("ellipse", { cx: x + w / 2, cy: y + h / 2, rx: w / 2, ry: h / 2, fill: "none", stroke: col, "stroke-width": it.width ?? 3, "stroke-dasharray": dash }, undefined, g);
        else el("rect", { x, y, width: w, height: h, rx: 6, fill: "none", stroke: col, "stroke-width": it.width ?? 3, "stroke-dasharray": dash }, undefined, g);
        box = [x, y, w, h];
      }
      // The note: at `at`, else beside the shape's top right.
      const at = Array.isArray(it.at) ? it.at.map(Number) : box ? [box[0] + box[2] + 8, box[1] + 4] : null;
      if (at) {
        el("circle", { cx: at[0] + 9, cy: at[1] + 1, r: 9, fill: col }, undefined, g);
        el("text", { x: at[0] + 9, y: at[1] + 5, class: "num", "text-anchor": "middle" }, String(it.n), g);
        if (it.text) {
          const t = el("text", { x: at[0] + 23, y: at[1] + 6, class: "lbl", fill: col }, String(it.text).slice(0, 80), g);
          const w = t.getComputedTextLength?.() || String(it.text).length * 7;
          const tb = [at[0], at[1] - 10, w + 26, 22];
          box = box ? [Math.min(box[0], tb[0]), Math.min(box[1], tb[1]), Math.max(box[0] + box[2], tb[0] + tb[2]) - Math.min(box[0], tb[0]), Math.max(box[1] + box[3], tb[1] + tb[3]) - Math.min(box[1], tb[1])] : tb;
        }
      }
      if (box) boxes.push({ n: it.n, id: it.id, text: it.text, box });
    }
  }

  // Anchors: which correction a Mark is about (the person circling or striking one of them).
  reflex.anchors.register({
    resolve(region) {
      if (!visible) return { kind: "local", bounds: region.bounds.map(Math.round), label: "the sketch (corrections hidden)" };
      const [bx, by, bw, bh] = region.bounds;
      const cx = bx + bw / 2, cy = by + bh / 2;
      const hit = boxes.filter((b) => b.box[0] - 12 < bx + bw && b.box[0] + b.box[2] + 12 > bx && b.box[1] - 12 < by + bh && b.box[1] + b.box[3] + 12 > by);
      if (!hit.length) return { kind: "local", bounds: region.bounds.map(Math.round), label: "the sketch, away from the corrections" };
      // The correction the Mark sits on: the smallest one whose box holds its center, then the nearest.
      const holds = (b) => b.box[0] - 12 <= cx && cx <= b.box[0] + b.box[2] + 12 && b.box[1] - 12 <= cy && cy <= b.box[1] + b.box[3] + 12;
      const area = (b) => (b.box[2] + 24) * (b.box[3] + 24);
      const d = (b) => Math.hypot(b.box[0] + b.box[2] / 2 - cx, b.box[1] + b.box[3] / 2 - cy);
      hit.sort((a, b) => (holds(b) - holds(a)) || (holds(a) ? area(a) - area(b) : d(a) - d(b)));
      return { kind: "correction", items: hit.map((b) => String(b.id ?? b.n)), label: `correction ${hit[0].id ?? hit[0].n}${hit[0].text ? ` "${String(hit[0].text).slice(0, 50)}"` : ""}`.slice(0, 200) };
    },
  });

  draw();
  addEventListener("resize", draw);
})();
</script>
</body>
</html>
