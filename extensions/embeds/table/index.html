<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font: 14px -apple-system, system-ui, "Segoe UI", sans-serif; color: #1d1d1f; }
  h1 { font-size: 16px; margin: 14px 16px 10px; }
  table { border-collapse: collapse; margin: 0 16px; width: calc(100% - 32px); }
  th { text-align: left; font-weight: 600; color: #6e6e73; font-size: 12px; border-bottom: 1.5px solid #d2d2d7; padding: 8px 10px; }
  td { border-bottom: 1px solid #ececf0; padding: 10px; font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; }
  tr.best td { font-weight: 600; }
  tr .st { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f2f2f7; color: #6e6e73; }
  tr.status-running .st { background: #e6f4ff; color: #0060c0; }
  tr.status-done .st { background: #e6f6ec; color: #18794e; }
  tr.status-killed td { color: #aeaeb2; text-decoration: line-through; }
  tr.status-approved .st { background: #e6f6ec; color: #18794e; }
  tr.status-failed .st { background: #ffeaea; color: #c4262e; }
  tr.hl td { background: #fff8e1; }
  .note { margin: 10px 16px; color: #6e6e73; font-size: 12px; }
</style>
</head>
<body>
<h1 id="title" hidden></h1>
<table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
<div class="note" id="note" hidden></div>
<script>
(() => {
  const p = reflex.element.props();
  const cols = (Array.isArray(p.columns) ? p.columns : []).map((c) => (typeof c === "string" ? { key: c, label: c } : { key: String(c.key), label: String(c.label ?? c.key), unit: c.unit, numeric: c.numeric }));
  const rows = (Array.isArray(p.rows) ? p.rows : []).map((r, i) => ({ ...r, id: String(r.id ?? `r${i + 1}`) }));
  const hasStatus = rows.some((r) => r.status);
  const hl = new Set(Array.isArray(p.highlight) ? p.highlight.map(String) : []);
  if (p.title) Object.assign(document.getElementById("title"), { textContent: p.title, hidden: false });
  if (p.note) Object.assign(document.getElementById("note"), { textContent: p.note, hidden: false });
  const numeric = (c) => c.numeric ?? rows.every((r) => r.cells?.[c.key] === undefined || typeof r.cells[c.key] === "number");
  const fmt = (v, c) => (v === undefined || v === null ? "—" : typeof v === "number" ? `${+v.toPrecision(6)}${c.unit ? ` ${c.unit}` : ""}` : String(v));
  const head = document.getElementById("head"), body = document.getElementById("body");
  for (const c of cols) {
    const th = document.createElement("th");
    th.textContent = c.label;
    th.dataset.col = c.key;
    if (numeric(c)) th.className = "num";
    head.append(th);
  }
  if (hasStatus) head.append(Object.assign(document.createElement("th"), { textContent: "Status" }));
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.dataset.row = r.id;
    if (r.status) tr.classList.add(`status-${String(r.status).toLowerCase()}`);
    if (hl.has(r.id)) tr.classList.add("hl");
    if (r.best) tr.classList.add("best");
    for (const c of cols) {
      const td = document.createElement("td");
      td.dataset.col = c.key;
      td.textContent = fmt(r.cells?.[c.key], c); // text, never markup
      if (numeric(c)) td.className = "num";
      tr.append(td);
    }
    if (hasStatus) {
      const td = document.createElement("td");
      td.dataset.col = "status";
      td.append(Object.assign(document.createElement("span"), { className: "st", textContent: r.status ? String(r.status) : "" }));
      tr.append(td);
    }
    body.append(tr);
  }

  // ---------- Anchors: the rows, columns and cells a Mark covers ----------
  const inside = (pt, poly) => {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  const center = (r) => [(r.left + r.right) / 2, (r.top + r.bottom) / 2];
  const value = (row, key) => rows.find((r) => r.id === row)?.cells?.[key];

  reflex.anchors.register({
    resolve(region) {
      const pts = (region.points ?? []).map((q) => [q[0], q[1]]);
      if (!pts.length) return null;
      const [bx, by, bw, bh] = region.bounds;
      const first = pts[0], last = pts[pts.length - 1];
      const closed = pts.length > 8 && Math.hypot(first[0] - last[0], first[1] - last[1]) < 0.35 * Math.hypot(bw, bh);
      const trs = [...body.querySelectorAll("tr")];
      const ths = [...head.querySelectorAll("th[data-col]")];
      // A loop around a column heading means the column.
      const headHit = ths.filter((th) => (closed ? inside(center(th.getBoundingClientRect()), pts) : pts.some(([x, y]) => { const r = th.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; })));
      let cells;
      if (closed) {
        cells = [...body.querySelectorAll("td")].filter((td) => inside(center(td.getBoundingClientRect()), pts));
        if (!cells.length) cells = [...body.querySelectorAll("td")].filter((td) => { const r = td.getBoundingClientRect(); return r.left < bx + bw && r.right > bx && r.top < by + bh && r.bottom > by; });
      } else {
        // A tick, strike or line: the rows it crosses, weighted by how much of the stroke lies on each.
        const counts = new Map();
        for (const [x, y] of pts) {
          const tr = trs.find((t) => { const r = t.getBoundingClientRect(); return y >= r.top && y <= r.bottom; });
          if (tr) counts.set(tr, (counts.get(tr) ?? 0) + 1);
        }
        const max = Math.max(0, ...counts.values());
        const picked = [...counts].filter(([, n]) => n >= max * 0.35).map(([t]) => t);
        cells = picked.flatMap((t) => [...t.querySelectorAll("td")].filter((td) => { const r = td.getBoundingClientRect(); return r.left < bx + bw + 4 && r.right > bx - 4; }));
        if (!cells.length) cells = picked.flatMap((t) => [...t.querySelectorAll("td")]);
      }
      if (!cells.length && headHit.length) {
        const keys = headHit.map((th) => th.dataset.col);
        return { kind: "data", columns: keys, rows: rows.map((r) => r.id), label: `column${keys.length > 1 ? "s" : ""} ${headHit.map((t) => t.textContent).join(", ")}` };
      }
      if (!cells.length) return { kind: "local", bounds: region.bounds.map(Math.round), label: "the table, away from its rows" };
      const rowIds = [...new Set(cells.map((td) => td.parentElement.dataset.row))];
      const colKeys = [...new Set(cells.map((td) => td.dataset.col))].filter((k) => k !== "status");
      const out = { kind: "data", rows: rowIds, columns: colKeys };
      if (cells.length <= 12) out.cells = cells.filter((td) => td.dataset.col !== "status").map((td) => ({ row: td.parentElement.dataset.row, column: td.dataset.col, value: value(td.parentElement.dataset.row, td.dataset.col) ?? null }));
      const name = (id) => { const r = rows.find((x) => x.id === id); const first = cols[0] && r?.cells?.[cols[0].key]; return first !== undefined && String(first) !== id ? `${id} (${first})` : id; };
      out.label = (rowIds.length <= 3 ? `row${rowIds.length > 1 ? "s" : ""} ${rowIds.map(name).join(", ")}` : `${rowIds.length} rows: ${rowIds.slice(0, 3).join(", ")}…`) + (colKeys.length && colKeys.length < cols.length ? `, column${colKeys.length > 1 ? "s" : ""} ${colKeys.join(", ")}` : "");
      out.label = out.label.slice(0, 200);
      return out;
    },
  });
})();
</script>
</body>
</html>
