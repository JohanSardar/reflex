<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #fbfbfd; overflow: hidden; }
  body { font: 14px -apple-system, system-ui, "Segoe UI", sans-serif; color: #1d1d1f; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; padding: 12px 14px 8px; border-bottom: 1px solid #e5e5ea; }
  ul { list-style: none; margin: 0; padding: 4px 0; }
  li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 14px; min-height: 30px; border-bottom: 1px solid #f0f0f3; }
  .icon { flex: none; width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 1px; }
  .text { min-width: 0; flex: 1; }
  .name { font-weight: 500; }
  .dims, .note { font-size: 12px; color: #6e6e73; overflow-wrap: anywhere; }
  .note { color: #a35200; }
  .tag { flex: none; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-top: 3px; }
  .changed .tag { background: #fff1d6; color: #a35200; }
  .new .tag { background: #dcf5e4; color: #1b7a3d; }
  .error .tag { background: #ffe1e1; color: #b3261e; }
  .error .name { color: #b3261e; }
  .suppressed { opacity: 0.45; }
  .suppressed .name { text-decoration: line-through; }
</style>
</head>
<body>
<h1 id="title"></h1>
<ul id="tree"></ul>
<script>
(() => {
  const p = reflex.element.props();
  const KINDS = {
    body: ["B", "#636366"], sketch: ["S", "#0090ff"], pad: ["P", "#30a46c"], pocket: ["K", "#e5484d"],
    rib: ["R", "#6e56cf"], hole: ["H", "#f76b15"], fillet: ["F", "#12a594"], chamfer: ["C", "#12a594"],
    pattern: ["≡", "#d6409f"], mirror: ["M", "#d6409f"], shell: ["Sh", "#8e8e93"], other: ["•", "#8e8e93"],
  };
  const features = (Array.isArray(p.features) ? p.features : []).filter((f) => f && f.id != null && f.name != null);
  const title = document.getElementById("title");
  if (p.title) title.textContent = p.title; else title.remove();
  const tree = document.getElementById("tree");
  const make = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = String(text); // data is text, never markup
    return n;
  };
  for (const f of features) {
    const li = make("li", ["ok", undefined].includes(f.status) ? "" : f.status);
    li.dataset.id = String(f.id);
    li.style.paddingLeft = `${14 + 20 * Math.max(0, Math.min(8, f.depth | 0))}px`;
    const [glyph, color] = KINDS[f.kind] ?? KINDS.other;
    const icon = make("span", "icon", glyph);
    icon.style.background = color;
    const text = make("div", "text");
    text.append(make("div", "name", f.name));
    if (f.dims) text.append(make("div", "dims", f.dims));
    if (f.note) text.append(make("div", "note", f.note));
    li.append(icon, text);
    if (["changed", "new", "suppressed", "error"].includes(f.status)) li.append(make("span", "tag", f.status));
    tree.append(li);
  }

  // A Mark names the rows it encloses (a circle), or touches (an arrow tip, a strike, writing).
  const inside = (pt, poly) => {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  const rows = () => [...tree.children].map((li, i) => ({ f: features[i], r: li.getBoundingClientRect() }));
  const describe = (f) => `feature ${f.name}${f.kind ? ` (${f.kind}${f.part ? `, part ${f.part}` : ""})` : f.part ? ` (part ${f.part})` : ""}`;

  reflex.anchors.register({
    resolve(region) {
      const pts = (region.points ?? []).map((q) => [q[0], q[1]]);
      if (!pts.length) return null;
      const [, , bw, bh] = region.bounds;
      const first = pts[0], last = pts[pts.length - 1];
      const closed = pts.length > 8 && Math.hypot(first[0] - last[0], first[1] - last[1]) < 0.35 * Math.hypot(bw, bh);
      const all = rows();
      let found = closed ? all.filter(({ r }) => inside([r.left + 40, r.top + r.height / 2], pts) || inside([r.left + r.width / 2, r.top + r.height / 2], pts)) : [];
      if (!found.length) {
        // The row under most of the stroke.
        const count = new Map();
        for (const [x, y] of pts) {
          const hit = all.find(({ r }) => y >= r.top && y <= r.bottom && x >= r.left - 20 && x <= r.right + 20);
          if (hit) count.set(hit, (count.get(hit) ?? 0) + 1);
        }
        const best = [...count.entries()].sort((a, b) => b[1] - a[1])[0];
        if (best) found = [best[0]];
      }
      if (!found.length) return { kind: "local", bounds: region.bounds.map(Math.round), label: "the feature tree, away from its rows" };
      const fs = found.map(({ f }) => f);
      return {
        kind: "data",
        rows: fs.map((f) => String(f.id)).slice(0, 1000),
        label: (fs.length <= 3 ? fs.map(describe).join(", ") : `${fs.length} features: ${fs.slice(0, 3).map((f) => f.name).join(", ")}…`).slice(0, 200),
      };
    },
  });
})();
</script>
</body>
</html>
