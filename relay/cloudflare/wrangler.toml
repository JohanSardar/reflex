# The Reflex Relay on Cloudflare: the official one at reflex.eilmer.si
# (`wrangler deploy`), or locally with `wrangler dev`. To run your own on your
# Cloudflare account, change `routes` to your domain (see README).
name = "reflex-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Served only at its own domain, so the OAuth metadata names one origin.
workers_dev = false
preview_urls = false
routes = [{ pattern = "reflex.eilmer.si", custom_domain = true }]

[observability]
enabled = true

# `wrangler dev` would otherwise present every request as if it came to the
# route's host, and the OAuth metadata would name reflex.eilmer.si locally.
[dev]
port = 8787
host = "localhost:8787"
upstream_protocol = "http"

# The Agent layer reads the protocol's files and compiles its validators at
# start; a Worker can do neither, so build.ts bundles both ahead of time and
# these aliases point the Agent layer at them. The renderer uses resvg's WASM.
[build]
command = "node build.ts"

[alias]
"node:fs" = "./shims/fs.ts"
"ajv/dist/2020.js" = "./shims/ajv.ts"
"@resvg/resvg-js" = "./shims/resvg.ts"
# The Agent layer imports the Node binding in places; in the Worker it is the Workers one (same WASM module).
"@reflex/kernel/node" = "../../kernel/wasm/js/workers.ts"

# A Worker has no module URLs; the Agent layer only uses them to find protocol/ files (shims/fs.ts).
[define]
"import.meta.url" = "\"file:///worker/a/b/c/module.js\""

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOG"
class_name = "LogDO"

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LogDO", "AuthDO"]

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "reflex-relay-assets"
