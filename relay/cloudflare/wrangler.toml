name = "reflex-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "reflex.eilmer.si", custom_domain = true }]
[observability]
enabled = true
[dev]
port = 8787
host = "localhost:8787"
upstream_protocol = "http"
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LogDO", "AuthDO"]
# Applying this migration deletes the retired cloud logs and OAuth data.
# Requires the person's approval before any deployment.
[[migrations]]
tag = "v2-forward-only"
deleted_classes = ["LogDO", "AuthDO"]
